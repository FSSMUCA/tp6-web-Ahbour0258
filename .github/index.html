<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Calculatrice </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculatrice Locale & Introduction PHP</h1>
        <p>Effectuez vos opérations et consultez l'historique.</p>
    </header>

    <main>
        <section class="calculator-container">
            <h2>Calculatrice</h2>
            
            <form id="calculator-form">
                <div class="input-group">
                    <label for="numberA">Nombre A :</label>
                    <input type="number" id="numberA" required step="any" placeholder="Entrez le premier nombre">
                </div>

                <div class="input-group">
                    <label for="operation">Opération :</label>
                    <select id="operation" required>
                        <option value="add">+</option>
                        <option value="subtract">−</option>
                        <option value="multiply">×</option>
                        <option value="divide">÷</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="numberB">Nombre B :</label>
                    <input type="number" id="numberB" required step="any" placeholder="Entrez le second nombre">
                </div>

                <button type="submit" id="calculate-btn">Calculer</button>
            </form>

            <div id="error-message" class="error-zone" aria-live="polite"></div>
        </section>

        <hr>

        <section class="history-container">
            <h2>Historique des Opérations</h2>
            <div id="history-card" class="card">
                <ul id="history-list">
                    </ul>
            </div>
        </section>
        
        <hr>
        
        <section>
            <h2>Variables PHP</h2>
            <p>Cliquez pour voir l'introduction au PHP :</p>
            <a href="info.php" class="php-link-btn">Voir `info.php`</a>
        </section>

    </main>

    <footer>
        <p>&copy; TP6 - Développement Web </p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
